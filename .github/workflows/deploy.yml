name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  APP_DIR: /opt/apps/fotoflash-frontend
  # test stand; the backend answers /api and /media on the same domain
  DOMAIN: fotoflash.zagoruykov.site

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Checks
        run: |
          npm ci
          npm run typecheck
          npm run lint

      - name: Image name
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}
          build-args: |
            BACKEND_URL=https://${{ env.DOMAIN }}
            SITE_URL=https://${{ env.DOMAIN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        env:
          KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy
        env:
          HOST: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
          IMAGE: ${{ needs.build.outputs.image }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          ssh "$HOST" "mkdir -p $APP_DIR"
          scp docker-compose.yml "$HOST:$APP_DIR/docker-compose.yml"
          echo "$GHCR_TOKEN" | ssh "$HOST" "docker login ghcr.io -u $GHCR_USER --password-stdin"
          printf 'IMAGE=%s\nDOMAIN=%s\nBACKEND_URL=https://%s\nSITE_URL=https://%s\nREVALIDATE_SECRET=%s\n' \
            "$IMAGE" "$DOMAIN" "$DOMAIN" "$DOMAIN" "$REVALIDATE_SECRET" | ssh "$HOST" "cat > $APP_DIR/.env && chmod 600 $APP_DIR/.env"
          ssh "$HOST" "cd $APP_DIR && docker compose pull && docker compose up -d --remove-orphans && docker image prune -f"
